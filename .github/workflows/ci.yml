name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v5
        with:
          python-version: "3.11"

      - name: Compile Python
        run: python -m py_compile state_paths.py security_utils.py __init__.py moa_core.py moa_trigger.py media_tools.py dashboard/plugin_api.py

      - name: Run unit and release-safety tests
        run: python -m unittest discover -s tests -v

      - name: Check dashboard JavaScript
        run: node --check dashboard/dist/index.js

      - name: Check committed whitespace
        run: git diff-tree --check --no-commit-id --root -r HEAD
